<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EmphTTS Audio Samples</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#seedtts">Seed-TTS EN</a>
        <a href="#tinystress">TinyStress-15k</a>
      </nav>
      <div id="home" class="hero">
        <h1>EmphTTS Audio Samples</h1>
        <p class="lede">
          Listening examples for Seed-TTS EN and TinyStress-15k evaluation.
        </p>
      </div>
    </header>

    <main>
      <section class="intro" aria-label="Overview">
        <p>
          Each sample shows ground-truth speech, baseline systems, and our systems.
        </p>
      </section>

      <section id="seedtts" class="sample-section">
        <div class="section-heading">
          <p class="eyebrow">10 samples</p>
          <h2>Seed-TTS EN Listening Examples</h2>
        </div>
        <div id="seedtts-samples" class="sample-list" aria-live="polite"></div>
      </section>

      <section id="tinystress" class="sample-section">
        <div class="section-heading">
          <p class="eyebrow">10 samples</p>
          <h2>TinyStress-15k Listening Examples</h2>
        </div>
        <div id="tinystress-samples" class="sample-list" aria-live="polite"></div>
      </section>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script defer src="script.js"></script>
  </body>
</html>
